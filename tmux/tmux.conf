set -g default-terminal "screen-256color"
set -g mouse on # natural scrolling

# prefix binding - "command + space"
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# custom keymaps
unbind %
bind | split-window -h # horizontally
unbind '"'
bind - split-window -v

unbind r # refresh tmux
bind r source-file ~/.config/tmux/tmux.conf

# panes resizing
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

bind -r m resize-pane -Z
set -g mouse on

# tmux plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator' # for navigating panes and vim/nvim with Ctrl-hjkl
set -g @plugin 'jimeh/tmux-themepack' # to configure tmux theme
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes

# theme pack:
set -g @themepack 'powerline/default/cyan' # use this theme for tmux

# Custom Theme Overrides
set -g @themepack-status-left-area-middle-format "tjkott"
set -g @themepack-status-right-area-right-format "MacBook"

set -g @resurrect-capture-pane-contents 'on' # allow tmux-ressurect to capture pane contents
set -g @continuum-restore 'on' # enable tmux-continuum functionality

# Initialise tmux plugin manager. 
run '~/.tmux/plugins/tpm/tpm'


